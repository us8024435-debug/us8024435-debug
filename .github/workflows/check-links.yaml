name: Check Markdown Links

on:
  push:
    branches: [main, master]
    paths: ['**.md']
  pull_request:
    branches: [main, master]
    paths: ['**.md']
  # Run weekly to catch external link rot
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --timeout 30
            --max-retries 3
            '*.md'
          fail: true
